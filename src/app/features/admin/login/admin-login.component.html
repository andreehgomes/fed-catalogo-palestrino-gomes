<div class="login">
  <div class="login__card">
    <h1 class="login__titulo">Palestrino Gomes</h1>

    <button class="login__btn-google" (click)="entrarComGoogle()" [disabled]="carregandoGoogle()">
      @if (carregandoGoogle()) {
        <span class="login__spinner"></span>
        Entrando...
      } @else {
        <svg class="login__google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Entrar com Google
      }
    </button>

    @if (erroGoogle()) {
      <p class="login__erro">{{ erroGoogle() }}</p>
    }

    <div class="login__divisor"><span>Acesso administrativo</span></div>

    <form class="login__form" (ngSubmit)="entrar()">
      <div class="login__campo">
        <label for="email" class="login__label">E-mail</label>
        <input
          id="email"
          type="email"
          class="login__input"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="login__campo">
        <label for="senha" class="login__label">Senha</label>
        <input
          id="senha"
          type="password"
          class="login__input"
          [(ngModel)]="senha"
          name="senha"
          autocomplete="current-password"
          required
        />
      </div>

      @if (erro()) {
        <p class="login__erro">{{ erro() }}</p>
      }

      <button type="submit" class="login__btn" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
