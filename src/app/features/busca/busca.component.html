<div class="busca">
  <h1 class="busca__titulo">Busca</h1>

  <form class="busca__form" (ngSubmit)="buscar()">
    <input
      class="busca__input"
      type="search"
      placeholder="Buscar artigos..."
      [(ngModel)]="termo"
      name="q"
      autocomplete="off"
      (input)="buscar()"
    />
    <button type="submit" class="busca__btn">Buscar</button>
  </form>

  @if (carregando()) {
    <p class="busca__estado">Buscando...</p>
  } @else if (resultados().length === 0 && termo.length > 2) {
    <p class="busca__estado">Nenhum resultado encontrado para "<strong>{{ termo }}</strong>".</p>
  } @else if (resultados().length) {
    <p class="busca__total">{{ resultados().length }} resultado(s) para "<strong>{{ termo }}</strong>"</p>
    <div class="busca__grid">
      @for (post of resultados(); track post.id) {
        <app-article-card [post]="post" />
      }
    </div>
  }
</div>
