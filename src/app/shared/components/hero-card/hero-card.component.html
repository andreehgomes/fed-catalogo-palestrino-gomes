<article
  class="hero"
  [style.backgroundImage]="'url(' + post().coverUrl + ')'"
  aria-label="Artigo em destaque"
>
  <div class="hero__overlay">
    <div class="hero__content">
      <p class="hero__categoria">{{ post().categoriaSlug }}</p>
      <h1 class="hero__titulo">{{ post().titulo }}</h1>
      <p class="hero__excerpt">{{ post().excerpt }}</p>
      <app-button variante="primary">
        <a [routerLink]="['/', post().categoriaSlug, post().slug]" class="hero__cta-link">
          Ler análise
        </a>
      </app-button>
    </div>
  </div>
</article>
